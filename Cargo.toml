[package]
name = "rlpcli"
version = "1.3.5"
edition = "2024"
description = "Tiny LessPass API server client CLI to get passwords and site settings"
readme = "README.md"
repository = "https://gitlab.com/ogarcia/rlpcli"
license = "GPL-3.0-or-later"
keywords = ["lesspass", "rockpass", "password", "client", "cli"]
categories = ["command-line-utilities"]

[dependencies]
clap = { version = "4.5", features = ["cargo"] }
env_logger = "0.11"
lesspass = "0.5"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
ureq = { version = "3.0", features = ["json"] }
url = "2.5"
xdg = "3.0"

[dev-dependencies]
mockito = "1.7"
